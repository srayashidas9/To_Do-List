<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f9f9f9; color: #333; display: flex; justify-content: center; padding-top: 50px; }
        .container { background: #fff; width: 100%; max-width: 400px; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { margin-bottom: 15px; font-weight: 500; font-size: 1.4rem; text-align: center; }
        form { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; outline: none; }
        button { background: #111; color: #fff; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
        ul { list-style: none; }
        li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
        .completed { text-decoration: line-through; color: #aaa; }
        .actions a { text-decoration: none; color: #888; margin-left: 8px; font-size: 0.9rem; }
        .actions a:hover { color: #000; }
    </style>
</head>
<body>
    <div class="container">
        <h2>To-Do List</h2>
        <form action="/add" method="POST">
            <input type="text" name="task" placeholder="Add a new task..." required>
            <button type="submit">Add</button>
        </form>
        <ul>
            {% for task in tasks %}
            <li>
                <span class="{{ 'completed' if task.done else '' }}">{{ task.title }}</span>
                <div class="actions">
                    <a href="/complete/{{ task.id }}">{{ '✓' if not task.done else '↺' }}</a>
                    <a href="/delete/{{ task.id }}">✕</a>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
